name: Build and release portable apps
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  package:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate package version and release tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/release.cjs validate
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run prepare:assets
      - run: npm run check
      - run: npm test
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never
      - name: Package Linux
        if: runner.os == 'Linux'
        run: npm run dist:linux -- --publish never
      - name: Exercise packaged Windows application
        if: runner.os == 'Windows'
        run: npm run smoke:packaged
      - name: Exercise packaged Linux application
        if: runner.os == 'Linux'
        env:
          PORTAL_TEST_NO_SANDBOX: '1'
        run: xvfb-run -a npm run smoke:packaged
      - name: Exercise AppImage without FUSE
        if: runner.os == 'Linux'
        env:
          PORTAL_TEST_NO_SANDBOX: '1'
          PORTAL_TEST_APPIMAGE_EXTRACT: '1'
        run: xvfb-run -a npm run smoke:appimage
      - uses: actions/upload-artifact@v4
        with:
          name: LiteParse-Portal-${{ runner.os }}
          compression-level: 0
          overwrite: true
          path: |
            release/*.exe
            release/*.zip
            release/*.tar.gz
            release/*.AppImage
            release/smoke-*.png
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: LiteParse-Portal-*
          merge-multiple: true
          path: release/publish
      - name: Verify files and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.cjs publish
